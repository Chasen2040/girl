name: Build girl APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unpack girl project
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)
          test -n "$ZIP" || { echo 'No ZIP found at repository root'; exit 1; }
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted
          test -f extracted/girl_android/settings.gradle

      - name: Build APK using preinstalled Android SDK
        working-directory: extracted/girl_android
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -n 1)
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER" || { echo 'sdkmanager not found'; exit 1; }
          echo "Using: $SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses < /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0'
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: girl-APK
          path: extracted/girl_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
