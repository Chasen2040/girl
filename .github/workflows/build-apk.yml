name: Build girl APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get files
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unpack girl project
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)
          test -n "$ZIP"
          unzip -q "$ZIP" -d extracted
          test -f extracted/girl_android/settings.gradle

      - name: Build APK
        working-directory: extracted/girl_android
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          gradle :app:assembleDebug --no-daemon

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: girl-APK
          path: extracted/girl_android/app/build/outputs/apk/debug/app-debug.apk
